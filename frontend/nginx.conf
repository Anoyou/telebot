# 前端 Nginx 站点配置
# - 静态资源使用 SPA fallback（任何未匹配的路径都回退到 index.html）
# - PWA 入口与 service worker 禁止缓存，避免移动端安装后长期持有旧 bundle
# - /api/ 反向代理至后端容器 web:8000
# - /healthz 直接透传到后端，便于外部探活

map $uri $telepilot_cache_control {
    default "no-cache, no-store, must-revalidate";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/(apple-touch-icon|brand-logo|favicon-16x16|favicon-32x32|pwa-192x192|pwa-512x512|pwa-maskable-512x512)\.png$ "public, max-age=604800";
}

server {
    listen 80;
    server_name _;

    # 正常静态资源与 API 访问由应用内结构化日志覆盖，避免轮询请求刷满控制台。
    access_log off;

    root /usr/share/nginx/html;
    index index.html;

    # 文档与更新日志来自宿主机同步的公开运行时内容目录，不参与前端构建。
    # 只开放明确的公开 Markdown；REVISION 或误放入目录的其它文件一律不可下载。
    location = /runtime-content/CHANGELOG.md {
        try_files $uri =404;
        default_type text/plain;
        charset utf-8;
    }

    location ~ ^/runtime-content/docs/(PLUGIN-(AI|API-REFERENCE|CHEATSHEET|DEV-GUIDE|DEVTOOLS|HTTP|OVERVIEW|QUICKSTART|REMOTE|RULES|SAFETY|WEBHOOK-QUICKSTART)|PLATFORM-CAPABILITIES|SECURITY-OPS)\.md$ {
        try_files $uri =404;
        default_type text/plain;
        charset utf-8;
    }

    # 禁止该目录落入 SPA fallback，也不公开白名单之外的运行时文件。
    location /runtime-content/ {
        return 404;
    }

    # 静态资源：单页应用 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 原生流式端点必须逐块转发。若使用默认 proxy_buffering，Nginx 会把上游
    # NDJSON/SSE 合并后才交给浏览器，使后端真实 delta 在 UI 中看起来像整段跳出。
    location ~ ^/api/(commands/llm-providers/(quick-verify|[^/]+/chat-test-models)/stream|system-agent/) {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        add_header X-Accel-Buffering "no" always;
    }

    # 反向代理后端 API
    location /api/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 检查更新会在后端同步 git fetch，最长可达 ~150s；单用户自部署场景放宽到 180s。
        proxy_read_timeout 180s;
    }

    # 健康检查直接透传
    location /healthz {
        proxy_pass http://web:8000/healthz;
    }

    # 备份/恢复时可能上传较大文件，放宽至 50M
    client_max_body_size 50M;

    # 启用 gzip，常见文本类型压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 低风险高收益安全头；HSTS 建议放在公网 HTTPS 反代层统一配置
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 注意：下面的 sha256 精确放行 index.html 里那段内联主题引导脚本。改动该脚本
    # （含其中注释）都会改变 hash，必须同步更新此处，否则 CSP 会拦掉脚本、主题/状态栏
    # 色初始化失效。重算：node -e 见 CONTRIBUTING，或 python 对 <script> 内容取 sha256。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-p9TfOeONJsyeLI6wYGZCog9uX4Mu2nRHvEg7MD7B6Rg='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control $telepilot_cache_control always;
}
