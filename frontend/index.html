<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA 主题色（Android Chrome 顶栏 + iOS Safari 状态栏底色） -->
    <meta name="theme-color" content="#F2F0EC" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS 全屏 PWA：从主屏幕启动时隐藏 Safari UI -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TelePilot" />
    <!-- iOS 状态栏保持 default，让系统按当前页面明暗选择图标颜色。
         Safari 26 不再可靠使用 theme-color 填充主屏 Web App 的状态栏，而是在首帧取样
         页面 canvas/body；因此下面的 head 内联样式必须在 body 创建前先铺好主题底色。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <style id="telepilot-chrome-bootstrap">
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background-color: var(--telepilot-app-chrome, #F2F0EC);
      }
    </style>

    <script data-telepilot-chrome-bootstrap>
      (function () {
        try {
          var theme = localStorage.getItem("telepilot-theme") || localStorage.getItem("telebot-theme") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = theme === "dark" || (theme === "system" && prefersDark);
          var chrome = dark ? "#1C1C1E" : "#F2F0EC";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document.documentElement.style.setProperty("--telepilot-app-chrome", chrome);
          document.documentElement.style.backgroundColor = chrome;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", chrome);
          var colorScheme = document.querySelector('meta[name="color-scheme"]');
          if (colorScheme) colorScheme.setAttribute("content", dark ? "dark" : "light");
          // iOS 26 的主屏 Web App 会在 React 启动前取样 body/canvas；CSS 变量由 html
          // 继承到稍后创建的 body，使状态栏和应用顶栏从第一帧就是同一块实色背景。
        } catch (e) {}
      })();
    </script>

    <!-- iOS 主屏幕图标（必须 PNG，180x180 是当前推荐尺寸） -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>TelePilot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
