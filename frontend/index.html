<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA 主题色（Android Chrome 顶栏 + iOS Safari 状态栏底色） -->
    <meta name="theme-color" content="#F2F0EC" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS 全屏 PWA：从主屏幕启动时隐藏 Safari UI -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TelePilot" />
    <!-- iOS 状态栏：静态用 black-translucent，让内容全屏透到状态栏下、由 app 自绘顶部
         chrome 色，消掉 default 模式下不透明状态栏底边与内容之间那条分割线。
         注意：iOS 在「添加到主屏」时锁定此值，运行时 JS 改它对已安装 PWA 无效——
         改这里后 iPhone 需删除并重新添加到主屏才生效。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <script>
      (function () {
        try {
          var theme = localStorage.getItem("telepilot-theme") || localStorage.getItem("telebot-theme") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = theme === "dark" || (theme === "system" && prefersDark);
          var chrome = dark ? "#1C1C1E" : "#F2F0EC";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document.documentElement.style.backgroundColor = chrome;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", chrome);
          // 状态栏样式两套主题都用 black-translucent：内容全屏透到状态栏下，
          // 消掉 default 模式的状态栏底边线。浅色白字的可读性由 .app-topbar::before
          // 的渐变遮罩兜底。（此值 iOS 在添加到主屏时锁定，运行时改不动已装 PWA。）
        } catch (e) {}
      })();
    </script>

    <!-- iOS 主屏幕图标（必须 PNG，180x180 是当前推荐尺寸） -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>TelePilot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
