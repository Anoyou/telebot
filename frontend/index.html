<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA 主题色（Android Chrome 顶栏 + iOS Safari 状态栏底色） -->
    <meta name="theme-color" content="#F2F0EC" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS 全屏 PWA：从主屏幕启动时隐藏 Safari UI -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TelePilot" />
    <!-- iOS 状态栏：用 default，而非 black-translucent。
         black-translucent 下 iOS 会强制状态栏文字恒为白，并在其后自绘一层深色半透明
         scrim 保证白字可读——那层 scrim 是系统画的、CSS 删不掉，就是浅色主题顶部那条
         灰带的真身。default 模式下 iOS 改用 theme-color 填状态栏底色、按亮度自动选深/浅
         文字色，无 scrim；顶栏 ::before 渐变与边框都已移除，也不会再有 default 旧版那条
         分割线。注意：iOS 在「添加到主屏」时锁定此值，改这里后 iPhone 需删除并重新添加
         到主屏才生效。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <script>
      (function () {
        try {
          var theme = localStorage.getItem("telepilot-theme") || localStorage.getItem("telebot-theme") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = theme === "dark" || (theme === "system" && prefersDark);
          var chrome = dark ? "#1C1C1E" : "#F2F0EC";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document.documentElement.style.backgroundColor = chrome;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", chrome);
          // theme-color 已随主题同步为 chrome 色，default 模式下 iOS 用它填状态栏底色、
          // 按亮度自动选文字色，无需再改 status-bar-style（且该值装机后锁定，运行时改不动）。
        } catch (e) {}
      })();
    </script>

    <!-- iOS 主屏幕图标（必须 PNG，180x180 是当前推荐尺寸） -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>TelePilot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
