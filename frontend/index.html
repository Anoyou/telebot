<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA 主题色（Android Chrome 顶栏 + iOS Safari 状态栏底色） -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="dark light" />

    <!-- iOS 全屏 PWA：从主屏幕启动时隐藏 Safari UI -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TelePilot" />
    <!-- iOS 状态栏：浅色用 default 避免顶部被半透明黑罩灰；深色启动脚本会切到 black-translucent。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <script>
      (function () {
        try {
          var theme = localStorage.getItem("telepilot-theme") || localStorage.getItem("telebot-theme") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = theme === "dark" || (theme === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0b1120" : "#ffffff");
          var statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (statusBar) statusBar.setAttribute("content", dark ? "black-translucent" : "default");
        } catch (e) {}
      })();
    </script>

    <!-- iOS 主屏幕图标（必须 PNG，180x180 是当前推荐尺寸） -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>TelePilot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
