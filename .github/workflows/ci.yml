name: CI

on:
  push:
    branches: [main, Agent-beta]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      MASTER_KEY: "4QAy7kFzv2mkHRXTHwL_FEZABz0R3sqat5rBl4vDLXk="
      JWT_SECRET: "telepilot-ci-jwt-secret-only-for-tests"
      PYTHONPATH: ".."
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Lint backend
        working-directory: backend
        run: ruff check app

      - name: Test backend
        working-directory: backend
        run: pytest

      - name: Validate plugin examples
        run: PYTHONPATH=backend:. python scripts/validate-plugin-examples.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend regression tests
        working-directory: frontend
        run: pnpm test

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  frontend-browser:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install pinned Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install chromium

      - name: Run accessibility tests
        working-directory: frontend
        run: pnpm test:a11y

      - name: Run visual regression tests
        working-directory: frontend
        run: pnpm test:visual

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release version sync
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          backend_init = Path("backend/app/__init__.py").read_text()
          backend_pyproject = Path("backend/pyproject.toml").read_text()
          frontend_version = Path("frontend/src/lib/version.ts").read_text()
          frontend_package = json.loads(Path("frontend/package.json").read_text())
          changelog = Path("CHANGELOG.md").read_text()

          versions = {
              "backend/app/__init__.py": re.search(r'__version__ = "([^"]+)"', backend_init).group(1),
              "backend/pyproject.toml": re.search(r'version = "([^"]+)"', backend_pyproject).group(1),
              "frontend/src/lib/version.ts": re.search(r'APP_VERSION = "([^"]+)"', frontend_version).group(1),
              "frontend/package.json": frontend_package["version"],
          }
          unique = set(versions.values())
          if len(unique) != 1:
              raise SystemExit(f"版本号不一致: {versions}")
          version = unique.pop()
          if f"## [{version}]" not in changelog and "## [Unreleased]" not in changelog:
              raise SystemExit(f"CHANGELOG.md 缺少版本 {version} 或 Unreleased 段")
          print(f"version sync ok: {version}")
          PY

      - name: Prevent non-main release version bumps
        if: github.event_name == 'push' && github.ref_name != 'main'
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          current_text = Path("backend/app/__init__.py").read_text()
          current = re.search(r'__version__ = "([^"]+)"', current_text).group(1)
          main_text = subprocess.check_output(
              ["git", "show", "origin/main:backend/app/__init__.py"],
              text=True,
          )
          main = re.search(r'__version__ = "([^"]+)"', main_text).group(1)
          if current != main:
              raise SystemExit(
                  f"非 main 分支不得独立发布版本：当前 {current}，main {main}。"
                  "请先合入 main，再由 main 统一迭代版本。"
              )
          print(f"non-main version guard ok: {current}")
          PY
