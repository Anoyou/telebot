name: CI

on:
  push:
    branches: [main, Beta]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: 变更范围
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      browser: ${{ steps.scope.outputs.browser }}
      plugin: ${{ steps.scope.outputs.plugin }}
      contract: ${{ steps.scope.outputs.contract }}
      version: ${{ steps.scope.outputs.version }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 计算需要运行的检查
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          args=(--root . --base "$BEFORE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT")
          if [[ "$EVENT_NAME" == "pull_request" || "$REF_NAME" == "main" ]]; then
            args+=(--force-full)
          fi
          python scripts/ci_change_scope.py "${args[@]}"

  backend:
    name: 后端
    needs: change-scope
    if: needs.change-scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      MASTER_KEY: "4QAy7kFzv2mkHRXTHwL_FEZABz0R3sqat5rBl4vDLXk="
      JWT_SECRET: "telepilot-ci-jwt-secret-only-for-tests"
      PYTHONPATH: ".."
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"

      - name: Lint backend
        working-directory: backend
        run: ruff check app

      - name: Test backend
        working-directory: backend
        run: pytest

      - name: Reject stale OpenAPI snapshot from any backend model change
        run: |
          python scripts/export-openapi.py
          git diff --exit-code -- openapi/telepilot.openapi.json

      - name: Validate plugin examples
        if: needs.change-scope.outputs.plugin == 'true' || needs.change-scope.outputs.full == 'true'
        run: PYTHONPATH=backend:. python scripts/validate-plugin-examples.py

  frontend:
    name: 前端
    needs: change-scope
    if: needs.change-scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend regression tests
        working-directory: frontend
        run: pnpm test

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  frontend-browser:
    name: 浏览器
    needs: change-scope
    if: needs.change-scope.outputs.browser == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install pinned Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install chromium

      - name: Run accessibility tests
        working-directory: frontend
        run: pnpm test:a11y

      - name: Run visual regression tests
        working-directory: frontend
        run: pnpm test:visual

  api-contract:
    name: API 契约
    needs: change-scope
    if: needs.change-scope.outputs.contract == 'true'
    runs-on: ubuntu-latest
    env:
      MASTER_KEY: "4QAy7kFzv2mkHRXTHwL_FEZABz0R3sqat5rBl4vDLXk="
      JWT_SECRET: "telepilot-ci-jwt-secret-only-for-tests"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install contract dependencies
        run: |
          python -m pip install -e "./backend[dev]"
          pnpm --dir frontend install --frozen-lockfile

      - name: Regenerate OpenAPI and TypeScript contract
        run: make codegen

      - name: Reject stale generated contract
        run: git diff --exit-code -- openapi/telepilot.openapi.json frontend/src/api/schema.ts

      - name: Test API contract invariants
        working-directory: backend
        run: pytest -q app/tests/test_openapi_contract.py

  version-sync:
    name: 版本同步
    needs: change-scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check release version sync
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          backend_init = Path("backend/app/__init__.py").read_text()
          backend_pyproject = Path("backend/pyproject.toml").read_text()
          frontend_version = Path("frontend/src/lib/version.ts").read_text()
          frontend_package = json.loads(Path("frontend/package.json").read_text())
          openapi_snapshot = json.loads(Path("openapi/telepilot.openapi.json").read_text())
          changelog = Path("CHANGELOG.md").read_text()

          versions = {
              "backend/app/__init__.py": re.search(r'__version__ = "([^"]+)"', backend_init).group(1),
              "backend/pyproject.toml": re.search(r'version = "([^"]+)"', backend_pyproject).group(1),
              "frontend/src/lib/version.ts": re.search(r'APP_VERSION = "([^"]+)"', frontend_version).group(1),
              "frontend/package.json": frontend_package["version"],
              "openapi/telepilot.openapi.json": openapi_snapshot["info"]["version"],
          }
          unique = set(versions.values())
          if len(unique) != 1:
              raise SystemExit(f"版本号不一致: {versions}")
          version = unique.pop()
          if f"## [{version}]" not in changelog and "## [Unreleased]" not in changelog:
              raise SystemExit(f"CHANGELOG.md 缺少版本 {version} 或 Unreleased 段")
          print(f"version sync ok: {version}")
          PY

      - name: Prevent non-main stable release version bumps
        if: github.event_name == 'push' && github.ref_name != 'main'
        run: |
          git fetch origin main --depth=1
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          current_text = Path("backend/app/__init__.py").read_text()
          current = re.search(r'__version__ = "([^"]+)"', current_text).group(1)
          main_text = subprocess.check_output(
              ["git", "show", "origin/main:backend/app/__init__.py"],
              text=True,
          )
          main = re.search(r'__version__ = "([^"]+)"', main_text).group(1)
          prerelease = re.fullmatch(r"\d+\.\d+\.\d+-(?:alpha|beta|rc)\.\d+", current)
          if current != main and not prerelease:
              raise SystemExit(
                  f"非 main 分支不得独立发布正式版本：当前 {current}，main {main}。"
                  "请先合入 main，再由 main 统一迭代正式版本；开发分支仅允许 alpha/beta/rc 预发布版本。"
              )
          channel = "预发布" if prerelease else "与 main 一致"
          print(f"non-main version guard ok: {current} ({channel})")
          PY

  ci-gate:
    name: CI Gate
    if: always()
    needs: [change-scope, backend, frontend, frontend-browser, api-contract, version-sync]
    runs-on: ubuntu-latest
    steps:
      - name: 汇总条件任务结果
        env:
          CHANGE_SCOPE: ${{ needs.change-scope.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BROWSER: ${{ needs.frontend-browser.result }}
          API_CONTRACT: ${{ needs.api-contract.result }}
          VERSION_SYNC: ${{ needs.version-sync.result }}
        run: |
          for result in "$CHANGE_SCOPE" "$BACKEND" "$FRONTEND" "$BROWSER" "$API_CONTRACT" "$VERSION_SYNC"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "CI 子任务失败或取消：$result" >&2
              exit 1
            fi
          done
          echo "所有必需检查已通过"

  publish-images:
    name: 发布预构建镜像
    needs: ci-gate
    if: always() && github.event_name == 'push' && needs.ci-gate.result == 'success'
    uses: ./.github/workflows/publish-images.yml
    with:
      revision: ${{ github.sha }}
      base_revision: ${{ github.event.before }}
      ref_name: ${{ github.ref_name }}
      ref_type: branch
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
